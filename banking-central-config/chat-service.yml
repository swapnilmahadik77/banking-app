server:
  port: 8087

spring:
  data:
    mongodb:
      uri: ${CHAT_MONGODB_URI:mongodb://localhost:27017/chat_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

banking:
  chat:
    max-message-length: 4000
    attachment-max-size-mb: 10
    session-idle-timeout: 15m
    retention-days: 2555
    websocket:
      heartbeat-interval: 20s
      max-sessions-per-user: 5
    routing:
      support-queue-topic: banking.chat.support-queue.v1
      transcript-topic: banking.chat.transcript.v1

