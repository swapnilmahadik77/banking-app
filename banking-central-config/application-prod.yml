spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1740000
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}

management:
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.01}

logging:
  level:
    root: WARN
    com.bank: INFO

banking:
  security:
    issuer-uri: ${OIDC_ISSUER_URI}
  data:
    encryption-key-ref: ${DATA_ENCRYPTION_KEY_REF}

