server:
  port: 8086

banking:
  notification:
    channels: [PUSH, EMAIL, SMS, IN_APP]
    retry-attempts: 5
    retry-backoff: 2s
    deduplication-ttl: 24h
    provider-timeout: 3s
  events:
    request-topic: banking.notification.requests.v1
    status-topic: banking.notification.status.v1
    dead-letter-topic: banking.notification.dlt.v1

